<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelPlan</title>
<style>
:root{--paper:#F5F6F2;--sheet:#FFFFFF;--ink:#1E2433;--sub:#5B6372;--line:#DCDFD8;--shu:#B4362A;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:32px 48px}
h1{font-size:26px;margin:0 0 4px}
p{color:var(--sub);margin:0 0 20px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
a{display:block;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);text-decoration:none}
a:hover,a:focus-visible{border-color:var(--shu);outline:none}
.d{font-size:12px;color:var(--shu);font-weight:700;letter-spacing:.06em}
.t{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>TravelPlan</h1>
  <p>旅程と予算のまとめ</p>
  <ul>
    <li><a href="2026-11-21_toyokawa-atsuta/"><span class="d">2026.11.21 土</span><br><span class="t">豊川稲荷と熱田神宮 ／ 御開帳の予算比較</span></a></li>
  </ul>
</div>
</body>
</html>
